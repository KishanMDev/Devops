version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: app_db
    networks:
      - my-bridge-net

  redis:
    image: redis:alpine
    container_name: redis
    networks:
      - my-bridge-net

  flask:
    build: .
    container_name: flask
    ports:
      - "5001:5001"
    networks:
      - my-bridge-net
    depends_on:
      - mysql
      - redis

networks:
  my-bridge-net:
    name: my-bridge-net
    driver: bridge

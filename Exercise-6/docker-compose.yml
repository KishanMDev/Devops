version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./delivery_monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./delivery_monitoring/alerts_rules.yml:/etc/prometheus/alerts_rules.yml

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
